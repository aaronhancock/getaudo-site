<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultation Request Sent | Audo</title>
  <meta name="description" content="Your Audo consultation request has been received.">
  <link rel="icon" href="/favicon.ico?v=20260630">
  <link rel="icon" href="/assets/favicon.svg?v=20260630" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png?v=20260630" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260630">
  <style>
    :root {
      --ink: #18221d;
      --muted: #5f6b62;
      --paper: #fbfbf7;
      --white: #ffffff;
      --brass: #f0c66f;
      --charcoal: #101815;
      --line: rgba(24, 34, 29, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--white);
      background:
        linear-gradient(90deg, rgba(11, 16, 14, 0.88), rgba(11, 16, 14, 0.5)),
        url("/assets/consulting-technology-hero.webp") center / cover no-repeat;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(720px, 100%);
    }

    img {
      width: 142px;
      height: auto;
      margin-bottom: 46px;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.22));
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 19px;
      line-height: 1.6;
    }

    .eyebrow {
      margin-bottom: 16px;
      color: #f4dca9;
      font-size: 13px;
      font-weight: 820;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(46px, 9vw, 84px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.44);
      border-radius: 8px;
      padding: 0 18px;
      color: var(--white);
      background: rgba(255, 255, 255, 0.12);
      text-decoration: none;
      font-size: 15px;
      font-weight: 820;
      backdrop-filter: blur(10px);
    }

    a.primary {
      border-color: var(--brass);
      color: var(--ink);
      background: var(--brass);
    }

    @media (max-width: 620px) {
      body {
        align-items: start;
        padding-top: 32px;
      }

      img {
        width: 126px;
        margin-bottom: 82px;
      }

      h1 {
        font-size: clamp(40px, 14vw, 58px);
      }

      p {
        font-size: 17px;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/audo-logo-white.png" alt="Audo">
    <p class="eyebrow">Request received</p>
    <h1>Your request is in.</h1>
    <p>Your consultation request was saved and sent to Aaron for review. If it looks like a good fit, the next reply will be a practical first step and a simple path to talk.</p>
    <div class="actions">
      <a class="primary" href="/">Back to Audo</a>
      <a href="/#services">Review services</a>
    </div>
  </main>
</body>
</html>
